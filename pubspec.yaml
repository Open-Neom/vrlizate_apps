name: vrlizate_apps
description: Versioned VRlizate packages, local discovery, HTTPS catalogs, and library coordination.
version: 1.0.0
homepage: https://github.com/Open-Neom/vrlizate_apps
repository: https://github.com/Open-Neom/vrlizate_apps
issue_tracker: https://github.com/Open-Neom/vrlizate_apps/issues
environment:
  sdk: ^3.10.8
  flutter: '>=3.47.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_scene: ^0.24.3
  vector_math: ^2.2.0
  # Legacy portable profiles require STORE local headers without descriptors.
  archive: 4.3.0
  crypto: ^3.0.7
  http: ^1.6.0
  vrlizate_world: ^1.0.0
  vrlizate_scene: ^1.0.0
  vrlizate: ^1.13.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
